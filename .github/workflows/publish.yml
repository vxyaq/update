name: "publish"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm ci

      - name: setup JDK 21 (build dash-agent)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: build dash-agent.jar
        shell: bash
        run: |
          bash dash-agent/build.sh
          mv dash-agent/dash-agent.jar "dash-agent/dash-agent-${GITHUB_REF_NAME#v}.jar"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Dash Client ${{ github.ref_name }}"
          releaseBody: "Dash Client — instalator Windows (.exe NSIS + .msi). Auto-update pobierze ja sam."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: upload dash-agent.jar to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dash-agent/dash-agent-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
